<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <!-- Background with smooth rounded corner -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Outer subtle circular glow -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffedd5" stroke-width="4" stroke-opacity="0.25"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#ffedd5" stroke-width="3" stroke-opacity="0.15"/>

  <!-- Speaker Cone / Indian Acoustic Motif -->
  <g transform="translate(136, 156)">
    <!-- Main Speaker Body -->
    <path d="M40 70 L90 70 L150 20 L150 180 L90 130 L40 130 Z" fill="#ffffff" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.2))"/>
    
    <!-- Sound Waves with dynamic Indian vocal cadence -->
    <path d="M180 60 A 55 55 0 0 1 180 140" fill="none" stroke="#ffedd5" stroke-width="16" stroke-linecap="round"/>
    <path d="M210 35 A 95 95 0 0 1 210 165" fill="none" stroke="#fed7aa" stroke-width="16" stroke-linecap="round"/>
    <path d="M240 10 A 135 135 0 0 1 240 190" fill="none" stroke="#fdba74" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- Typography / Brand Badge -->
  <rect x="156" y="375" width="200" height="42" rx="21" fill="#431407" fill-opacity="0.6"/>
  <text x="256" y="402" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffedd5" text-anchor="middle" letter-spacing="2">DKA · TTS</text>
</svg>
