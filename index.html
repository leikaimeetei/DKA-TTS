    <script>
      // Gracefully ignore HMR WebSocket notices in cloud container preview environments
      window.addEventListener('error', (event) => {
        if (event?.message && (event.message.includes('WebSocket') || event.message.includes('ws://') || event.message.includes('wss://'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', (event) => {
        const msg = event?.reason?.message || String(event?.reason || '');
        if (msg.includes('WebSocket') || msg.includes('ws://') || msg.includes('wss://')) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      const _origErr = console.error;
      console.error = function (...args) {
        const str = args.map((a) => (a instanceof Error ? a.message : String(a))).join(' ');
        if (str.includes('WebSocket closed without opened') || str.includes('WebSocket') && (str.includes('closed') || str.includes('failed'))) {
          return;
        }
        _origErr.apply(console, args);
      };
    </script>
